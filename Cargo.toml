[package]
name = "earfun-studio"
version = "1.4.0"
edition = "2021"
description = "Ứng dụng desktop điều khiển tai nghe EarFun Air Pro 4 (TW600) cho Windows và Ubuntu"
license = "MIT"
authors = ["EarFun Studio Contributors"]

[features]
ui-capture = ["eframe/__screenshot"]

[[bin]]
name = "earfun-studio"
path = "src/main.rs"

[dependencies]
btleplug = "0.11"
chrono = "0.4"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.29"
futures = "0.3"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process"] }
uuid = "1.0"

# GNOME does not provide server-side decorations on Wayland. eframe disables
# winit's defaults, so explicitly restore its Adwaita titlebar on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
