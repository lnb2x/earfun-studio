name: Build and Release (Windows & Ubuntu)

on:
  push:
    branches:
      - main
      - codex/ubuntu-app
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ubuntu:
    name: Build Ubuntu (x86_64 .tar.gz & .deb)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libglib2.0-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests & smoke test
        run: |
          cargo test
          cargo run --release -- --smoke-test

      - name: Build Ubuntu packages
        run: ./packaging/build.sh

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-packages
          path: |
            dist/EarFunStudio-Ubuntu-*.tar.gz
            dist/earfun-studio_*_amd64.deb

  build-windows:
    name: Build Windows (x86_64 .exe & .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test

      - name: Build Windows packages
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/EarFunStudio-Windows-*.exe
            dist/EarFunStudio-Windows-*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-ubuntu, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or Update GitHub Release v1.3.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            TAG="v1.3.0"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "EarFun Studio ${TAG} (Rust · Windows & Ubuntu)" \
              --notes-file docs/release-1.3.md
          fi
