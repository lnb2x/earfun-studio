name: Build and Release (Windows & Ubuntu)

on:
  push:
    branches:
      - main
      - codex/ubuntu-app
      - "codex/release-*"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ubuntu:
    name: Build Ubuntu (x86_64 .tar.gz & .deb)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libglib2.0-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libgl1-mesa-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests & smoke test
        run: |
          cargo test --locked
          env -u DISPLAY -u WAYLAND_DISPLAY cargo run --locked --release -- --smoke-test

      - name: Build Ubuntu packages
        run: ./packaging/build.sh

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-packages
          path: |
            dist/EarFunStudio-Ubuntu-*.tar.gz
            dist/earfun-studio_*_amd64.deb

  build-windows:
    name: Build Windows (x86_64 .exe & .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked

      - name: Build Windows packages
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/EarFunStudio-Windows-*.exe
            dist/EarFunStudio-Windows-*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-ubuntu, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          TAG="${GITHUB_REF_NAME}"
          test "$TAG" = "v$VERSION"
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --title "EarFun Studio ${TAG} · Windows & Ubuntu" \
            --notes-file "docs/release-${VERSION%.*}.md"
